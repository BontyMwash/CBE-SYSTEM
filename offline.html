<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — CBE Exam Register</title>
<style>
  :root { color-scheme: light; }
  html, body {
    height: 100%; margin: 0;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: #F5F6FB; color: #12172B;
  }
  .wrap {
    min-height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px;
  }
  .swatch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    width: 56px; height: 56px; margin-bottom: 20px;
  }
  .swatch span { border-radius: 6px; }
  .swatch span:nth-child(1) { background: #1F9254; }
  .swatch span:nth-child(2) { background: #2F6FE0; }
  .swatch span:nth-child(3) { background: #E8A33D; }
  .swatch span:nth-child(4) { background: #D6473F; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #5B6478; margin: 0 0 24px; max-width: 340px; line-height: 1.5; }
  button {
    background: #171B3A; color: #fff; border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #232963; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="swatch"><span></span><span></span><span></span><span></span></div>
    <h1>You're offline</h1>
    <p>The app shell loaded from your device, but results and reports need an internet connection to sync with the server. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
