<!DOCTYPE html>
<!-- B~CBE Analytics — Copyright (c) 2026 B~CBE Analytics. All rights reserved. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B~CBE Analytics</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#171B3A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="B~CBE Analytics" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<!-- Chart.js: powers the dashboard analytics charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- html2pdf.js (html2canvas + jsPDF bundled): powers every one-click
     "Download PDF" button — renders a report element straight to a
     downloadable PDF file, entirely client-side, no server involved. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  // Apply saved theme before paint, so there's no light-mode flash.
  (function () {
    try {
      const saved = localStorage.getItem('cbeTheme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- Homepage (marketing landing page, shown first for signed-out visitors) -->
<div id="homeRoot" style="display:none;"></div>

<!-- Login screen (shown when nobody is logged in) -->
<div id="loginRoot" class="login-screen" style="display:none;"></div>

<!-- Main app shell (shown after login) -->
<div class="app" id="appRoot" style="display:none;">

  <!-- Mobile backdrop for the slide-in sidebar -->
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="icons/logo-mark.png" alt="B~CBE Analytics" class="brand-logo" width="34" height="34" />
      <span class="brand-mark">B~CBE</span>
      <span class="brand-name">Analytics</span>
    </div>
    <div id="levelSwitcherWrap" class="level-switcher-wrap">
      <!-- populated by app.js: lets a superadmin/admin/teacher switch
           which section (Primary / Junior Secondary / Senior School)
           the whole app is filtered to, or shows a locked badge for a
           section-scoped admin login -->
    </div>

    <nav class="nav" id="navList">
      <!-- populated by app.js based on role -->
    </nav>

    <div class="sidebar-foot" id="sidebarFoot">
      <!-- populated by app.js -->
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="frozen-banner" id="frozenBanner">
      <span class="frozen-dot"></span>
      <span>This school's account is frozen.</span>
      <span class="detail" id="frozenBannerDetail">Contact the school administrator to restore access.</span>
    </div>
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5H17M3 10H17M3 15H17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>
        <div class="topbar-title-block">
          <h1 id="pageTitle">Dashboard</h1>
          <span class="topbar-welcome" id="topbarWelcome"></span>
        </div>
      </div>

      <div class="topbar-center">
        <div class="header-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="globalSearch" placeholder="Search students by name or admission no…" aria-label="Search students">
        </div>
      </div>

      <div class="topbar-actions" id="topbarActionsWrap">
        <div id="topbarActions"></div>

        <div class="header-anchor">
          <button class="icon-btn" id="notifBellBtn" aria-label="Notifications" title="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="notif-dot" id="notifDot"></span>
          </button>
          <div class="dropdown-panel" id="notifPanel"></div>
        </div>

        <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
        </button>

        <div class="header-anchor">
          <div class="user-menu" id="userMenuBtn" title="Account">
            <span class="avatar" id="userAvatar">--</span>
            <span class="user-meta">
              <span class="user-name" id="userMenuName">—</span><br>
              <span class="user-role" id="userMenuRole">—</span>
            </span>
          </div>
          <div class="dropdown-panel" id="userPanel"></div>
        </div>

        <span class="last-sync" id="lastSync"></span>
      </div>
    </header>

    <div class="content" id="content">
      <!-- rendered by views.js -->
    </div>
  </main>
</div>

<!-- Floating action button: quick "Enter Marks" shortcut on mobile -->
<button class="fab" id="fabEnterMarks" aria-label="Enter marks" title="Enter marks">
  <i class="fa-solid fa-pen"></i>
</button>

<!-- Modal root -->
<div id="modalRoot"></div>

<!-- Toast root -->
<div id="toastRoot" class="toast-root"></div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- SheetJS: parses .xlsx/.xls files for bulk student import. CSV import
     works fully offline; Excel needs this library loaded once per session. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- App scripts, in dependency order -->
<script src="js/supabaseClient.js"></script>
<script src="js/data.js"></script>
<script src="js/grading.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/import.js"></script>
<script src="js/views.js"></script>
<script src="js/classes.js"></script>
<script src="js/auth-views.js"></script>
<script src="js/broadsheet.js"></script>
<script src="js/analysis.js"></script>
<script src="js/notify.js"></script>
<script src="js/teacher.js"></script>
<script src="js/attendance.js"></script>
<script src="js/app.js"></script>

<!-- PWA: register service worker for installability + offline app shell -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  // Offer "Add to Home Screen" once, the first time the browser says it's
  // installable, using the app's own toast so it matches the design.
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (sessionStorage.getItem('cbeInstallOffered')) return;
    sessionStorage.setItem('cbeInstallOffered', '1');
    setTimeout(() => {
      if (!deferredInstallPrompt) return;
      const root = document.getElementById('toastRoot');
      if (!root) return;
      const el = document.createElement('div');
      el.className = 'toast';
      el.style.cursor = 'pointer';
      el.textContent = 'Install this app on your device — tap here';
      el.addEventListener('click', async () => {
        el.remove();
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      });
      root.appendChild(el);
      setTimeout(() => el.remove(), 8000);
    }, 2500);
  });
</script>
</body>
</html>
